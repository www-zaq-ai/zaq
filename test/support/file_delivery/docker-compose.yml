services:
  postgres:
    image: postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: mattermost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost"]
      interval: 2s
      timeout: 3s
      retries: 30
  mattermost:
    image: ${ZAQ_FILE_MATTERMOST_IMAGE:-mattermost/mattermost-team-edition@sha256:68f9788a401c0e44caa2b9de413aa2da75da59d75725237a8098820721da0a13}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1::8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:local-test-only@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
  mailpit:
    image: ${ZAQ_FILE_MAILPIT_IMAGE:-axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498}
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
