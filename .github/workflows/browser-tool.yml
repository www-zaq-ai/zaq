name: Browser Tool Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: paradedb/paradedb:0.23.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zaq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      AGENT_BROWSER_BIN: ${{ github.workspace }}/test/support/bin/agent-browser-container
      ZAQ_BROWSER_CONTAINER: zaq-browser-flow-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-browser-tool-otp28.1-elixir1.19.5-${{ hashFiles('mix.lock') }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the production browser runtime (no release or test sources)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: browser-runtime
          load: true
          push: false
          tags: zaq-browser-flow:ci
          cache-from: type=gha,scope=browser-tool
          cache-to: type=gha,mode=max,scope=browser-tool

      - name: Start isolated browser runtime
        run: |
          docker run --detach --init --network host \
            --name "$ZAQ_BROWSER_CONTAINER" --user 1000 \
            --env AGENT_BROWSER_ALLOWED_DOMAINS=127.0.0.1 \
            --entrypoint /bin/sleep zaq-browser-flow:ci infinity
          "$AGENT_BROWSER_BIN" --version
          docker exec "$ZAQ_BROWSER_CONTAINER" /usr/bin/chromium --version
          docker image inspect zaq-browser-flow:ci --format '{{.Id}}'

      - name: Verify raw Chromium launch
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          sh test/support/bin/browser-runtime-smoke 2>&1 | tee "$RUNNER_TEMP/browser-runtime-smoke.log"

      - name: Install test dependencies
        run: mix deps.get

      - name: Provision database extensions as DBA
        run: mix run --no-start .github/scripts/provision-test-database.exs paradedb

      - name: Exercise the real browser tool through the agent
        run: mix test test/zaq/agent/browser_flow_integration_test.exs --include real_browser

      # The first integration open captures state before session cleanup on
      # failure. Also inspect remaining processes before container removal.
      - name: Browser container and process state
        if: always()
        timeout-minutes: 1
        run: |
          docker inspect --format '{{json .State}}' "$ZAQ_BROWSER_CONTAINER" || true
          docker top "$ZAQ_BROWSER_CONTAINER" -eo pid,ppid,user,stat,comm || true

      - name: Retain browser launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove browser runtime and all its sessions
        if: always()
        run: |
          if docker container inspect "$ZAQ_BROWSER_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$ZAQ_BROWSER_CONTAINER"
          fi
