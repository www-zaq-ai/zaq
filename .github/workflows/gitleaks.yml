name: gitleaks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
jobs:
  scan:
    name: gitleaks
    # PRs are scanned before queue admission; report this required check as skipped in the queue.
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} 
