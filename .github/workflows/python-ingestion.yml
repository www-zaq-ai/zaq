name: Python Ingestion

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ingestion:
    name: Test (real Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zaq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zaq_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.5"

      - name: Restore Mix dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ runner.arch }}-mix-deps-${{ hashFiles('mix.lock') }}

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Fetch reviewed crawler revision
        run: mix zaq.python.fetch

      - name: Set up CPython 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-py3.13-pip-${{ hashFiles('priv/python/crawler-ingest/requirements.lock', 'priv/python/crawler-ingest.revision') }}

      - name: Check the Python provisioner
        run: python3.13 -m unittest discover -s test/python -p 'test_*.py' -v

      - name: Build and validate a fresh Python environment
        run: python3.13 scripts/provision_python.py priv/python/crawler-ingest .venv

      - name: Provision PostgreSQL extensions as DBA
        run: mix run --no-start .github/scripts/provision-test-database.exs postgres

      - name: Run real ImageDedup integration test
        run: mix test test/zaq/ingestion/python/steps/image_dedup_real_python_test.exs --include real_python
